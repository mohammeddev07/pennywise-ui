# Netlify build. Headers live in public/_headers (shared with Cloudflare Pages).
# Set VITE_API_BASE_URL (and optionally VITE_GOOGLE_CLIENT_ID, VITE_SUPPORT_EMAIL) in Site settings > Environment variables.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.19.4"

# Single-page app: every route serves index.html (Cloudflare Pages does this automatically).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
